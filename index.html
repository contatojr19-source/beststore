<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestStore - Premium Streaming & Suporte</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#7c3aed',
                            pink: '#db2777',
                            dark: '#0a0b0d',
                            card: '#12141a'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0b0d;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: auto;
            height: 300px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .active-tab {
            color: #ffffff;
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid rgba(124, 58, 237, 0.5);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUp 0.5s ease-out forwards; }
    </style>
</head>
<body class="antialiased">

    <!-- Navegação -->
    <nav class="fixed top-0 w-full z-50 glass border-b border-white/5">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('store')">
                <div class="bg-gradient-to-br from-brand-purple to-brand-pink p-2 rounded-xl shadow-lg shadow-purple-500/20">
                    <span class="text-xl">⭐</span>
                </div>
                <span class="text-2xl font-black tracking-tighter uppercase">Best<span class="text-brand-purple">Store</span></span>
            </div>

            <div class="hidden md:flex gap-4 p-1 bg-white/5 rounded-2xl border border-white/5">
                <button onclick="navigateTo('store')" id="nav-store" class="nav-link px-6 py-2 rounded-xl text-sm font-bold transition-all active-tab">Catálogo</button>
                <button onclick="navigateTo('warranty')" id="nav-warranty" class="nav-link px-6 py-2 rounded-xl text-sm font-bold text-gray-400 hover:text-white transition-all">Segurança & Garantia</button>
            </div>

            <div class="flex items-center gap-4">
                <div id="status-indicator" class="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-[10px] font-black uppercase tracking-widest text-gray-400">
                    <span class="w-2 h-2 rounded-full bg-gray-500"></span> Verificando...
                </div>
                <button onclick="toggleCart()" class="relative p-3 bg-white/5 hover:bg-white/10 rounded-xl transition-all">
                    <span>🛒</span>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-brand-purple text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-brand-dark hidden">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Área Principal -->
    <main id="main-view" class="pt-28 pb-20">
        <!-- Conteúdo dinâmico -->
    </main>

    <!-- Carrinho Lateral -->
    <div id="cart-drawer" class="fixed inset-y-0 right-0 w-full max-w-md glass z-[100] translate-x-full transition-transform duration-500 ease-in-out flex flex-col shadow-2xl">
        <div class="p-6 border-b border-white/10 flex items-center justify-between">
            <h2 class="text-xl font-black uppercase tracking-tight">Seu Carrinho</h2>
            <button onclick="toggleCart()" class="p-2 hover:bg-white/10 rounded-full">✕</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4">
            <!-- Itens -->
        </div>
        <div class="p-8 border-t border-white/10 space-y-6">
            <div class="flex justify-between items-center">
                <span class="text-gray-400 font-bold uppercase text-xs">Total</span>
                <span id="cart-total" class="text-3xl font-black">R$ 0,00</span>
            </div>
            <button onclick="checkoutWhatsApp()" class="w-full bg-gradient-to-r from-brand-purple to-brand-pink py-4 rounded-2xl font-black uppercase tracking-widest hover:scale-[1.02] transition-all shadow-xl shadow-purple-500/20">
                Finalizar no WhatsApp
            </button>
        </div>
    </div>

    <!-- Templates -->
    
    <!-- VIEW: LOJA -->
    <template id="template-store">
        <div class="max-w-7xl mx-auto px-6 animate-slide-up">
            <header class="text-center mb-16 relative">
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-3xl h-64 bg-brand-purple/20 blur-[120px] -z-10"></div>
                <h2 class="text-5xl md:text-7xl font-black tracking-tighter mb-6 uppercase">Planos <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-purple to-brand-pink">Premium</span></h2>
                <p class="text-gray-400 max-w-2xl mx-auto text-lg">As melhores marcas de streaming com entrega imediata e o visual que você já conhece.</p>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="product-grid">
                <!-- Grid de Produtos -->
            </div>
        </div>
    </template>

    <!-- VIEW: GARANTIA -->
    <template id="template-warranty">
        <div class="max-w-7xl mx-auto px-6 animate-slide-up">
            <header class="mb-12">
                <h2 class="text-4xl font-black tracking-tight mb-4 uppercase">Segurança <span class="text-brand-purple">& Confiança</span></h2>
                <p class="text-gray-400 max-w-3xl">Análise interativa dos nossos compromissos de serviço. Transparência total sobre prazos e coberturas.</p>
            </header>

            <div class="flex gap-4 mb-8 overflow-x-auto no-scrollbar pb-2">
                <button onclick="switchWarrantySection('termo')" class="w-tab px-6 py-2 rounded-xl glass text-xs font-black uppercase tracking-widest border-brand-purple/50 bg-brand-purple/10">Garantia 30 Dias</button>
                <button onclick="switchWarrantySection('prazos')" class="w-tab px-6 py-2 rounded-xl glass text-xs font-black uppercase tracking-widest border-transparent text-gray-500">Prazos de Entrega</button>
                <button onclick="switchWarrantySection('seguranca')" class="w-tab px-6 py-2 rounded-xl glass text-xs font-black uppercase tracking-widest border-transparent text-gray-500">Protocolos</button>
            </div>

            <div id="warranty-content" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Conteúdo -->
            </div>
        </div>
    </template>

    <script>
        const PRODUCTS = [
            { id: 1, name: "Netflix Premium", price: 19.90, brand: "🔴", category: "Streaming", features: ["4K + HDR", "1 Tela Privada", "Garantia 30d"], color: "from-red-500/20" },
            { id: 2, name: "Spotify Premium", price: 14.90, brand: "🟢", category: "Música", features: ["Sua Conta", "Modo Offline", "Sem Anúncios"], color: "from-green-500/20" },
            { id: 3, name: "Disney+ Star+", price: 24.90, brand: "🔵", category: "Combo", features: ["Tudo em Um", "Esportes ao vivo", "4K HDR"], color: "from-blue-500/20" },
            { id: 4, name: "YouTube Premium", price: 12.50, brand: "📺", category: "Streaming", features: ["Sem Propaganda", "Background Play", "Music Incluso"], color: "from-red-600/20" },
            { id: 5, name: "HBO Max", price: 15.00, brand: "🟣", category: "Streaming", features: ["Cinema em Casa", "Exclusivos HBO", "Séries e Filmes"], color: "from-purple-500/20" },
            { id: 6, name: "Xbox Game Pass", price: 35.00, brand: "🎮", category: "Jogos", features: ["+100 Jogos", "PC & Console", "EA Play Incluso"], color: "from-green-600/20" }
        ];

        let state = { view: 'store', warrantySection: 'termo', cart: [], isCartOpen: false };

        function navigateTo(view) {
            state.view = view;
            render();
            document.querySelectorAll('.nav-link').forEach(btn => {
                if (btn.id === `nav-${view}`) btn.classList.add('active-tab');
                else btn.classList.remove('active-tab');
            });
        }

        function render() {
            const main = document.getElementById('main-view');
            const template = document.getElementById(`template-${state.view}`);
            main.innerHTML = template.innerHTML;
            if (state.view === 'store') renderProducts();
            else if (state.view === 'warranty') renderWarrantySection();
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = PRODUCTS.map(p => `
                <div class="group relative bg-brand-card border border-white/5 p-8 rounded-[32px] hover:border-brand-purple/50 transition-all duration-300 bg-gradient-to-b ${p.color} to-transparent">
                    <div class="flex justify-between items-start mb-6">
                        <div class="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center text-2xl">${p.brand}</div>
                        <button onclick="addToCart(${p.id})" class="bg-white text-black p-3 rounded-2xl hover:bg-brand-purple hover:text-white transition-all active:scale-90">
                            <span class="font-bold text-xl">+</span>
                        </button>
                    </div>
                    <h3 class="text-2xl font-black mb-1">${p.name}</h3>
                    <p class="text-[10px] font-black uppercase tracking-widest text-brand-purple mb-6">${p.category}</p>
                    <ul class="space-y-3 mb-8">
                        ${p.features.map(f => `<li class="text-sm text-gray-400 flex items-center gap-2"><span class="text-brand-purple">✓</span> ${f}</li>`).join('')}
                    </ul>
                    <div class="flex items-baseline gap-1">
                        <span class="text-sm text-gray-500 font-bold">R$</span>
                        <span class="text-4xl font-black">${p.price.toFixed(2).replace('.', ',')}</span>
                    </div>
                </div>
            `).join('');
        }

        function toggleCart() {
            state.isCartOpen = !state.isCartOpen;
            const drawer = document.getElementById('cart-drawer');
            drawer.style.transform = state.isCartOpen ? 'translateX(0)' : 'translateX(100%)';
            renderCart();
        }

        function addToCart(id) {
            const product = PRODUCTS.find(p => p.id === id);
            if (!state.cart.find(item => item.id === id)) {
                state.cart.push(product);
                updateCartUI();
            }
            if (!state.isCartOpen) toggleCart();
        }

        function updateCartUI() {
            const count = document.getElementById('cart-count');
            count.innerText = state.cart.length;
            count.classList.toggle('hidden', state.cart.length === 0);
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-items');
            const totalDisplay = document.getElementById('cart-total');
            if (state.cart.length === 0) {
                list.innerHTML = `<div class="h-full flex flex-col items-center justify-center opacity-20"><span class="text-5xl mb-4">👜</span><p class="font-bold uppercase tracking-widest text-[10px]">Vazio</p></div>`;
                totalDisplay.innerText = "R$ 0,00";
                return;
            }
            list.innerHTML = state.cart.map(item => `
                <div class="flex items-center gap-4 bg-white/5 p-4 rounded-2xl border border-white/5">
                    <div class="text-xl">${item.brand}</div>
                    <div class="flex-1">
                        <h4 class="font-bold text-sm tracking-tight">${item.name}</h4>
                        <p class="text-[10px] text-brand-purple font-black uppercase">R$ ${item.price.toFixed(2).replace('.', ',')}</p>
                    </div>
                    <button onclick="removeFromCart(${item.id})" class="text-gray-600 hover:text-red-500 transition-colors">✕</button>
                </div>
            `).join('');
            const total = state.cart.reduce((acc, curr) => acc + curr.price, 0);
            totalDisplay.innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function removeFromCart(id) {
            state.cart = state.cart.filter(i => i.id !== id);
            updateCartUI();
        }

        function checkoutWhatsApp() {
            const total = state.cart.reduce((acc, curr) => acc + curr.price, 0);
            const text = `Olá BestStore! Gostaria de comprar:\n\n${state.cart.map(i => `✅ ${i.name} - R$ ${i.price.toFixed(2).replace('.', ',')}`).join('\n')}\n\nTOTAL: R$ ${total.toFixed(2).replace('.', ',')}\n\n(Li e aceito os termos de garantia)`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        function switchWarrantySection(section) {
            state.warrantySection = section;
            renderWarrantySection();
            document.querySelectorAll('.w-tab').forEach(btn => {
                if (btn.innerText.toLowerCase().includes(section.substring(0,3))) {
                    btn.classList.add('border-brand-purple/50', 'bg-brand-purple/10', 'text-white');
                    btn.classList.remove('border-transparent', 'text-gray-500');
                } else {
                    btn.classList.remove('border-brand-purple/50', 'bg-brand-purple/10', 'text-white');
                    btn.classList.add('border-transparent', 'text-gray-500');
                }
            });
        }

        function renderWarrantySection() {
            const container = document.getElementById('warranty-content');
            if (state.warrantySection === 'termo') {
                container.innerHTML = `
                    <div class="bg-brand-card p-8 rounded-3xl border border-white/5 space-y-6">
                        <h3 class="text-xl font-bold flex items-center gap-2"><span class="text-brand-purple">🛡️</span> Garantia de 30 Dias</h3>
                        <p class="text-sm text-gray-400">Proteção total contra interrupções. Veja o que está coberto pela nossa loja.</p>
                        <div class="space-y-4">
                            <div class="p-4 rounded-2xl bg-green-500/5 border border-green-500/10 text-xs">
                                <p class="font-bold text-green-500 uppercase mb-1">Incluso</p>
                                <p class="text-gray-400">Quedas de acesso, erros de senha, expiração antecipada.</p>
                            </div>
                            <div class="p-4 rounded-2xl bg-red-500/5 border border-red-500/10 text-xs">
                                <p class="font-bold text-red-500 uppercase mb-1">Não Incluso</p>
                                <p class="text-gray-400">Uso de VPN, troca de dados da conta pelo cliente.</p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-brand-card p-8 rounded-3xl border border-white/5 flex flex-col justify-center">
                        <div class="chart-container"><canvas id="chartW"></canvas></div>
                    </div>
                `;
                initWChart();
            } else if (state.warrantySection === 'prazos') {
                container.innerHTML = `
                    <div class="bg-brand-card p-8 rounded-3xl border border-white/5 space-y-6">
                        <h3 class="text-xl font-bold flex items-center gap-2"><span class="text-brand-purple">🚀</span> Agilidade BestStore</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="p-6 rounded-2xl bg-white/5 border border-white/5 text-center">
                                <span class="block text-3xl font-black text-brand-purple mb-1">10 min</span>
                                <span class="text-[9px] text-gray-500 uppercase font-bold tracking-widest">Entrega Máxima</span>
                            </div>
                            <div class="p-6 rounded-2xl bg-white/5 border border-white/5 text-center">
                                <span class="block text-3xl font-black text-brand-pink mb-1">24h</span>
                                <span class="text-[9px] text-gray-500 uppercase font-bold tracking-widest">Suporte/Troca</span>
                            </div>
                        </div>
                    </div>
                    <div class="bg-brand-card p-8 rounded-3xl border border-white/5 flex flex-col justify-center">
                        <div class="chart-container"><canvas id="chartL"></canvas></div>
                    </div>
                `;
                initLChart();
            } else {
                container.innerHTML = `
                    <div class="col-span-full grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-brand-card p-8 rounded-3xl border border-white/5 text-center space-y-4">
                            <div class="text-4xl">🔒</div>
                            <h4 class="font-bold uppercase text-xs tracking-widest">Criptografia</h4>
                            <p class="text-xs text-gray-500">Dados protegidos de ponta a ponta em cada compra.</p>
                        </div>
                        <div class="bg-brand-card p-8 rounded-3xl border border-white/5 text-center space-y-4">
                            <div class="text-4xl">💳</div>
                            <h4 class="font-bold uppercase text-xs tracking-widest">Pagamento</h4>
                            <p class="text-xs text-gray-500">Métodos rastreáveis e seguros (PIX/Cartão).</p>
                        </div>
                        <div class="bg-brand-card p-8 rounded-3xl border border-white/5 text-center space-y-4">
                            <div class="text-4xl">✅</div>
                            <h4 class="font-bold uppercase text-xs tracking-widest">Entrega</h4>
                            <p class="text-xs text-gray-500">Acesso enviado exclusivamente aos canais do cliente.</p>
                        </div>
                    </div>
                `;
            }
        }

        function initWChart() {
            const ctx = document.getElementById('chartW');
            if(!ctx) return;
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Cobertura Loja', 'Mau Uso'],
                    datasets: [{
                        data: [75, 25],
                        backgroundColor: ['#7c3aed', '#db2777'],
                        borderWidth: 0
                    }]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } }
            });
        }

        function initLChart() {
            const ctx = document.getElementById('chartL');
            if(!ctx) return;
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Entrega (Min)', 'Suporte (Horas)'],
                    datasets: [{
                        label: 'Tempo Máximo',
                        data: [10, 24],
                        backgroundColor: ['#7c3aed', '#db2777'],
                        borderRadius: 8
                    }]
                },
                options: { 
                    maintainAspectRatio: false, 
                    scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#94a3b8' } } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateStatus() {
            const indicator = document.getElementById('status-indicator');
            const h = new Date().getHours();
            const d = new Date().getDay();
            const isOpen = d >= 1 && d <= 6 && h >= 9 && h < 22;
            if (isOpen) {
                indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Atendimento Online`;
                indicator.classList.replace('text-gray-400', 'text-green-400');
            } else {
                indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> Suporte Offline`;
                indicator.classList.replace('text-gray-400', 'text-red-400');
            }
        }

        document.addEventListener('DOMContentLoaded', () => { navigateTo('store'); updateStatus(); setInterval(updateStatus, 60000); });
    </script>
</body>
</html>
